# Goal - To ensure no secrets have leaked in the code

name: Secrete Scanning

on: 
    workflow_call:
      
jobs:
  scan_secretes:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: GitLeaks Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          