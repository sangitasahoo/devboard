apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
      - name: frontend
        image: sangitasahoo/devboard-frontend:v2
        ports:
        - containerPort: 5173

      resources:
        requests: # min needed
          cpu: 150m
          memory: 90Mi
        limits: # max usable
          cpu: 250m
          memory: 128Mi  
