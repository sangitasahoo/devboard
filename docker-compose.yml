services:

  postgres:
    container_name: "devboard-db"
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: "devboard-backend"
    image: sangitasahoo/devboard-backend:v2
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    environment:
      PORT: "${BACKEND_PORT}"
      POSTGRES_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres: 
        condition: service_healthy
    

  frontend:
    container_name: "devboard-frontend"
    image: sangitasahoo/devboard-frontend:v2
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT}:5173"  

volumes:
  pgdata: